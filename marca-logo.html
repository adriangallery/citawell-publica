<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;font-weight:600;src:url(bricolage-600.woff2) format("woff2")}
html,body{margin:0;background:transparent}
.w{display:inline-flex;align-items:center;gap:34px;height:193px;padding:0 6px 0 0}
.w svg{height:180px;width:180px}
.w span{font-family:B;font-weight:600;font-size:168px;letter-spacing:-6px;line-height:1}
.i{display:flex;align-items:center;justify-content:center}
</style></head><body>
<div id="x"></div>
<script>
const p=new URLSearchParams(location.search), modo=p.get('m'), col=p.get('c');
const sym=`<svg viewBox="0 0 32 32" fill="none"><path d="M23.07 7.57A11 11 0 1 0 24.43 23.07" stroke="${col}" stroke-width="3.6" stroke-linecap="round"/><rect x="21.8" y="12.3" width="8.4" height="7.4" rx="2.4" fill="#FF5A3C"/></svg>`;
const x=document.getElementById('x');
if(modo==='logo'){x.innerHTML=`<div class="w">${sym}<span style="color:${col}">Citawell</span></div>`;}
else{const s=+p.get('s');x.innerHTML=`<div class="i" style="width:${s}px;height:${s}px">${sym.replace('<svg','<svg style="width:'+Math.round(s*.92)+'px;height:'+Math.round(s*.92)+'px"')}</div>`;}
</script></body></html>
